<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  document.addEventListener('DOMContentLoaded', syncBody);
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      if (!document.documentElement.getAttribute('data-theme')) {
        syncTheme(mq.matches ? 'dark' : 'light');
      }
      mq.addEventListener('change', function(e) { syncTheme(e.matches ? 'dark' : 'light'); });
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

    const MODES = [

    ];

    let state = { current: 0, mode: MODES[0].key };

    // ===== 模式按钮：由 MODES 动态生成 =====
    function renderModeButtons() {
      const ctrl = document.getElementById('modeControl');
      if (!ctrl) return;
      ctrl.innerHTML = MODES.map(m =>
        `<button class="segmented-btn" data-mode="${m.key}" onclick="setMode('${m.key}')">${m.label}</button>`
      ).join('');
    }

    // ===== SVG 架构图：节点与连接线动态渲染 =====
    function renderSvgDiagram() {
      const nodeGroup = document.getElementById('nodeGroup');
      const connectorGroup = document.getElementById('connectorGroup');
      if (!nodeGroup || !connectorGroup) return;

      const n = ITEMS.length;
      const viewW = 880, pad = 14, nodeW = 96, nodeH = 52, nodeY = 30;
      // gap = (viewW - 2*pad - n*nodeW)/(n-1) = (880-28-768)/7 = 12
      const gap = (viewW - 2 * pad - n * nodeW) / (n - 1);

      let nodesHtml = '', connectorsHtml = '';
      ITEMS.forEach((item, idx) => {
        const x = pad + idx * (nodeW + gap);
        const cx = x + nodeW / 2, cy = nodeY + nodeH / 2;

        if (idx < n - 1) {
          connectorsHtml += `
            <line id="connector-${idx}" x1="${x + nodeW + 3}" y1="${cy}"
                  x2="${x + nodeW + gap - 6}" y2="${cy}"
                  stroke="var(--stroke-default)" stroke-width="1.3" stroke-dasharray="0 4"
                  stroke-linecap="round" marker-end="url(#lumi-caret)"/>`;
        }
        nodesHtml += `
          <g class="diagram-node" id="svgNode-${idx}" onclick="selectStage(${idx})">
            <rect x="${x}" y="${nodeY}" width="${nodeW}" height="${nodeH}" rx="10"
                  fill="var(--surface-dim)" stroke="var(--stroke-default)" stroke-width="1"/>
            <text x="${cx}" y="${nodeY + 20}" text-anchor="middle" font-size="11"
                  font-family="var(--ff-mono)" fill="var(--on-surface-variant)">LAYER 0${idx + 1}</text>
            <text x="${cx}" y="${nodeY + 38}" text-anchor="middle" font-size="12"
                  font-family="var(--ff-sans)" font-weight="500" fill="var(--on-surface)">${item.shortName}</text>
          </g>`;
      });
      nodeGroup.innerHTML = nodesHtml;
      connectorGroup.innerHTML = connectorsHtml;
    }

    // ===== 事件处理器：只改 state，再调 updateViz() =====
    function selectStage(i) {
      if (i < 0 || i >= ITEMS.length) return;
      state.current = i;
      updateViz();
    }
    function changeStage(delta) {
      const next = state.current + delta;
      if (next >= 0 && next < ITEMS.length) { state.current = next; updateViz(); }
    }
    function setMode(mode) { state.mode = mode; updateViz(); }

    // ===== 单渲染函数：所有 DOM 更新集中在这里 =====
    function updateViz() {
      const item = ITEMS[state.current];

      document.getElementById('prevBtn').disabled = (state.current === 0);
      document.getElementById('nextBtn').disabled = (state.current === ITEMS.length - 1);
      document.getElementById('stageCounter').textContent =
        `层 ${state.current + 1} / ${ITEMS.length}`;

      ITEMS.forEach((_, idx) => {
        const nodeEl = document.getElementById(`svgNode-${idx}`);
        if (!nodeEl) return;
        const rect = nodeEl.querySelector('rect');
        if (idx === state.current) {
          nodeEl.classList.add('is-active');
          rect.setAttribute('fill', 'var(--accent-container)');
          rect.setAttribute('stroke', 'var(--primary)');
          rect.setAttribute('stroke-width', '2');
        } else {
          nodeEl.classList.remove('is-active');
          rect.setAttribute('fill', 'var(--surface-dim)');
          rect.setAttribute('stroke', 'var(--stroke-default)');
          rect.setAttribute('stroke-width', '1');
        }
        if (idx < ITEMS.length - 1) {
          const conn = document.getElementById(`connector-${idx}`);
          if (conn) {
            const active = idx === state.current || idx === state.current - 1;
            conn.setAttribute('stroke', active ? 'var(--primary)' : 'var(--stroke-default)');
            conn.classList.toggle('flow-line-active', active);
            conn.setAttribute('marker-end', active ? 'url(#lumi-caret-active)' : 'url(#lumi-caret)');
          }
        }
      });

      document.getElementById('itemTitle').textContent = item.title;
      document.getElementById('itemIdTag').textContent = `LAYER 0${state.current + 1}`;
      document.getElementById('inputStateText').textContent = item.inputState;
      document.getElementById('outputStateText').textContent = item.outputState;
      document.getElementById('actionDetailText').textContent = item.actionDetail;

      const pluginContainer = document.getElementById('pluginList');
      if (pluginContainer) {
        pluginContainer.innerHTML = (item.tags || [])
          .map(p => `<span class="plugin-pill"></span>`).join('');
        // 用 textContent 逐个填入，防注入
        pluginContainer.querySelectorAll('.plugin-pill').forEach((el, i) => {
          el.textContent = item.tags[i];
        });
      }

      const mode = MODES.find(m => m.key === state.mode);
      document.querySelectorAll('#modeControl .segmented-btn').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.mode === state.mode);
      });
      const codeViewer = document.getElementById('codeViewer');
      if (codeViewer) codeViewer.textContent = item[state.mode] || '';
      const desc = document.getElementById('modeDescription');
      if (desc) desc.textContent = mode ? mode.desc : '';
    }

    renderModeButtons();
    renderSvgDiagram();
    updateViz();

    // ===== iframe 自适应：向父页面上报高度 =====
    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(
        document.querySelector('.widget-container') || document.body
      );
    })();
  </script>
</body>
</html>
