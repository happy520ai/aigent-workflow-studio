version: "3.9"

services:
  aigent-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigent-workflow-backend
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      # SQLite 落盘到挂载卷（否则写在容器可写层，容器重建即丢）
      - AIGENT_DB_PATH=/app/data/aigent_checkpoints.db
      # 容器部署强烈建议设置：经 nginx 反代后后端看到的客户端 IP 是 Docker 网关，
      # 不是回环，未设令牌时设置的读写会按设计返回 403。
      # 设置后前端「设置」抽屉的「管理令牌」框填同一值即可。
      - AIGENT_ADMIN_TOKEN=${AIGENT_ADMIN_TOKEN:-}
      # 信任 compose 内网代理（nginx）转发的 X-Forwarded-For：
      # uvicorn 0.30 的 forwarded-allow-ips 仅支持精确 IP（无 CIDR），
      # 故给 nginx 容器分配静态 IP 172.28.0.3 并在此精确匹配
      - AIGENT_FORWARDED_ALLOW_IPS=${AIGENT_FORWARDED_ALLOW_IPS:-172.28.0.3,127.0.0.1,::1}
    networks:
      - aigent-net
    volumes:
      - ./backend/data:/app/data
    ports:
      # 宿主 8000 已被本机 aigent 后端占用，验证用 8010 映射容器内 8000
      - "8010:8000"

  aigent-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aigent-workflow-frontend
    restart: unless-stopped
    depends_on:
      - aigent-backend
    networks:
      aigent-net:
        # 静态 IP：后端 uvicorn 0.30 的 forwarded-allow-ips 精确信任此地址
        ipv4_address: 172.28.0.3
    ports:
      - "3000:80"

# 固定子网：给前端 nginx 一个静态 IP，供后端 forwarded-allow-ips 精确信任
networks:
  aigent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
