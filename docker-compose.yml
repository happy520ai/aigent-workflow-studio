services:
  aigent-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigent-workflow-backend
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      # SQLite 落盘到挂载卷（否则写在容器可写层，容器重建即丢）
      - AIGENT_DB_PATH=/app/data/aigent_checkpoints.db
      # 容器部署强烈建议设置：经 nginx 反代后后端看到的客户端 IP 是 Docker 网关，
      # 不是回环，未设令牌时设置的读写会按设计返回 403。
      # 设置后前端「设置」抽屉的「管理令牌」框填同一值即可。
      - AIGENT_ADMIN_TOKEN=${AIGENT_ADMIN_TOKEN:-}
      # WS/REST 同源白名单：按部署入口主机调整（T11 Origin 校验）
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # 信任 compose 内网代理（nginx）转发的 X-Forwarded-For：
      # uvicorn 的 forwarded-allow-ips 仅支持精确 IP（无 CIDR），
      # 故给 nginx 容器分配静态 IP 172.28.0.3 并在此精确匹配
      - AIGENT_FORWARDED_ALLOW_IPS=${AIGENT_FORWARDED_ALLOW_IPS:-172.28.0.3,127.0.0.1,::1}
    networks:
      - aigent-net
    volumes:
      - aigent-data:/app/data
    # T61：healthcheck + 依赖门控 + 资源限制
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      # 后端直连口（E2E/运维用）；生产可只保留前端入口
      - "8010:8000"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  aigent-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aigent-workflow-frontend
    restart: unless-stopped
    depends_on:
      aigent-backend:
        condition: service_healthy
    networks:
      aigent-net:
        # 静态 IP：后端 forwarded-allow-ips 精确信任此地址
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # 前端入口：宿主 3000 → 非 root nginx 8080
      - "3000:8080"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

# 固定子网：给前端 nginx 一个静态 IP，供后端 forwarded-allow-ips 精确信任
volumes:
  aigent-data:

networks:
  aigent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
